<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeagueClipFarm Review Queue</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>LeagueClipFarm</h1>
    <div class="account">
      <select id="account-select" title="Active summoner"></select>
      <button id="account-add" title="Add a new account">+ Account</button>
      <div id="account-form" class="account-form hidden">
        <input id="account-riot-id" placeholder="Name#TAG" autocomplete="off" />
        <select id="account-server" title="Server">
          <option value="na1">NA</option>
          <option value="euw1">EUW</option>
          <option value="eun1">EUNE</option>
          <option value="kr">KR</option>
          <option value="br1">BR</option>
          <option value="la1">LAN</option>
          <option value="la2">LAS</option>
          <option value="oc1">OCE</option>
          <option value="jp1">JP</option>
          <option value="tr1">TR</option>
          <option value="ru">RU</option>
        </select>
        <button id="account-save">Add &amp; Switch</button>
        <button id="account-cancel" class="secondary">Cancel</button>
        <span id="account-error" class="account-error"></span>
      </div>
    </div>
    <div class="account">
      <button id="key-btn" title="Update the Riot API key (expires every ~24h)">Riot Key</button>
      <div id="key-form" class="account-form hidden">
        <input id="key-input" placeholder="RGAPI-..." autocomplete="off" spellcheck="false" />
        <button id="key-save">Save</button>
        <button id="key-cancel" class="secondary">Cancel</button>
        <span id="key-error" class="account-error"></span>
      </div>
    </div>
    <div class="account">
      <button id="fb-btn" title="Facebook Page posting">Facebook</button>
      <div id="fb-form" class="account-form hidden">
        <input id="fb-page-id" placeholder="Page ID" autocomplete="off" spellcheck="false" />
        <input id="fb-token" placeholder="Page Access Token" autocomplete="off" spellcheck="false" />
        <label class="fb-enable"><input type="checkbox" id="fb-enabled" /> Enabled</label>
        <button id="fb-save">Save</button>
        <button id="fb-cancel" class="secondary">Cancel</button>
        <span id="fb-error" class="account-error"></span>
      </div>
    </div>
    <div class="account">
      <button id="autopost-btn" title="Automatically drip-post your best clips on a schedule">Auto-post: …</button>
      <div id="autopost-form" class="account-form hidden">
        <label class="fb-enable"><input type="checkbox" id="autopost-enabled" /> Enable auto-posting</label>
        <label title="Fixed: post at exactly the hours below every day. Explore: rotate through the test window day by day to LEARN which hours perform best (tracked on the Metrics page), then lock the winners in with its Apply-recommended button.">
          Schedule
          <select id="autopost-mode">
            <option value="fixed">Fixed hours</option>
            <option value="explore">Explore (test times)</option>
          </select>
        </label>
        <label id="autopost-hours-label" title="Local hours to post at (comma-separated, 0-23). One post per slot = your daily cap. In Explore mode only the COUNT matters (posts per day).">
          Post hours <input id="autopost-hours" placeholder="12, 17, 21" autocomplete="off" spellcheck="false" />
        </label>
        <label id="autopost-window-label" class="hidden" title="Explore mode rotates today's slots through this hour range (local, inclusive).">
          Test window <input id="autopost-window" placeholder="11-23" autocomplete="off" spellcheck="false" />
        </label>
        <label title="Skip clips weaker than this. 1 = allow solo kills; 2 = doubles and up only.">
          Min kill streak <input id="autopost-min-streak" type="number" min="1" max="5" />
        </label>
        <label title="Never auto-post more than this many clips from one game.">
          Per-game cap <input id="autopost-cap" type="number" min="1" max="10" />
        </label>
        <label class="fb-enable" title="Prefer a different champion than the last post and never reuse the previous post's title shape, so back-to-back uploads don't read as reposts.">
          <input type="checkbox" id="autopost-vary" /> Vary consecutive posts
        </label>
        <hr class="form-sep" />
        <label class="fb-enable"><input type="checkbox" id="autopost-fg-enabled" /> Auto-upload full games (long-form)</label>
        <label title="Local hours to upload full games (comma-separated). Separate from Shorts.">
          Full-game hours <input id="autopost-fg-hours" placeholder="15" autocomplete="off" spellcheck="false" />
        </label>
        <button id="autopost-save">Save</button>
        <button id="autopost-cancel" class="secondary">Cancel</button>
        <span id="autopost-status" class="autopost-status"></span>
      </div>
    </div>
    <a class="navlink" href="/metrics" title="Performance metrics dashboard">📊 Metrics</a>
    <div id="riot-banner" class="banner hidden"></div>
    <div id="yt-banner" class="banner hidden"
         title="The auto-posted engagement comment needs a one-time permission grant"></div>
    <button id="rematch" class="rematch hidden"></button>
    <div id="quota" class="quota"></div>
  </header>
  <main id="queue"></main>
  <template id="card-template">
    <article class="card">
      <video controls preload="none"></video>
      <img class="thumb" />
      <div class="fields">
        <input class="title" title="Title" />
        <textarea class="description" title="Description"></textarea>
        <input class="hashtags" title="Hashtags (shown in description)" placeholder="#hashtags" />
        <input class="tags" title="YouTube search tags (comma-separated, not publicly visible)" placeholder="search tags, comma separated" />
        <div class="meta"></div>
        <div class="dupe-warning" hidden></div>
        <div class="platforms"></div>
        <div class="target-status"></div>
        <div class="actions">
          <button class="regen">Regenerate Thumbnail</button>
          <button class="approve">Approve</button>
        </div>
        <div class="status"></div>
      </div>
    </article>
  </template>
  <script src="/static/dashboard.js"></script>
</body>
</html>
