[project]
name = "clipfarm"
version = "0.1.0"
description = "Automated ingest, metadata enrichment, and cross-posting pipeline for League of Legends Ascent recordings"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=6.0.0",
    "riotwatcher>=3.2.5",
    "pillow>=11.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "requests>=2.32.0",
    "PyYAML>=6.0.2",
    "google-api-python-client>=2.149.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["clipfarm*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "data", "music", "assets"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP modernize, B bugbear, BLE blind-except.
# Catch-all excepts are intentional in the background loops -- each carries an explanatory
# `# noqa: BLE001`, so BLE stays enabled to force that justification everywhere.
select = ["E", "W", "F", "I", "UP", "B", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["clipfarm", "scripts"]
